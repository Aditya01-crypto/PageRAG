[project]
name = "pagerag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aditya01-crypto", email = "adityapadiyara465@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.141.1",
    "fonttools>=4.66.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "slowapi>=0.1.10",
]

[project.scripts]
pagerag = "pagerag.main:start"
[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"
